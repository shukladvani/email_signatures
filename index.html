<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elysium Email Signature</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ===== Brand tokens (edit these) ===== */
        :root {
            --brand: #f97316;
            /* primary accent (orange) */
            --ink: #111827;
            /* main text */
            --muted: #6b7280;
            /* secondary text */
            --card: #ffffff;
            /* card bg */
            --rim: #e5e7eb;
            /* subtle borders */
            --chip: #fff7ed;
            /* soft orange chip bg */
        }

        /* Page framing (for preview/canva) */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f4f6;
            padding: 20px;
        }

        /* ===== Signature card ===== */
        .sig {
            max-width: 920px;
            margin: 0;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .10);
            border: 1px solid var(--rim);
            overflow: hidden;
        }

        /* top accent */
        .sig::before {
            content: "";
            display: block;
            height: 4px;
            background: linear-gradient(90deg, var(--brand), #ffb27a);
        }

        .row {
            display: flex;
            gap: 28px;
            padding: 26px 26px 10px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        /* ===== Left: identity & contacts ===== */
        .left {
            flex: 1 1 430px;
            min-width: 320px;
        }

        .name {
            font-size: 26px;
            line-height: 1.2;
            font-weight: 800;
            color: var(--ink);
            letter-spacing: .2px;
        }

        .name .accent {
            color: var(--brand);
        }

        .role {
            font-size: 14px;
            margin-top: 4px;
            color: var(--muted);
            letter-spacing: .3px;
        }

        .chips {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .chip {
            background: var(--chip);
            color: var(--brand);
            border: 1px solid rgba(249, 115, 22, .25);
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 700;
        }

        .contact div {
            font-size: 14px;
            margin: 6px 0;
            padding: 10px;
            color: #374151;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .contact i {
            color: #f97316;
            /* orange highlight */
            font-size: 15px;
            width: 18px;
            text-align: center;

        }

        .contact a {
            color: #374151;
            text-decoration: none;
        }

        .contact .muted {
            color: var(--muted);
        }

        /* SVG icon style */
        .ico {
            width: 24px;
            height: 24px;
            display: inline-block;
            color: var(--brand);
        }

        .social {
            display: flex;
            align-items: center;
            gap: 14px;
            border-top: 1px solid #ddd;
            padding-top: 14px;
        }

        .social span {
            font-size: 13px;
            color: #6b7280;
            font-weight: 600;
        }

        .social a {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 15px;
            text-decoration: none;
        }

        .facebook {
            background: #f97316;
        }

        .instagram {
            background: #f97316;
        }

        .twitter {
            background: #f97316;
        }

        .linkedin {
            color: #f97316;
        }



        /* ===== Right: big logo block ===== */
        .right {
            flex: 1 1 360px;
            min-width: 300px;
            border-left: 1px solid var(--rim);
            padding-left: 26px;
        }

        .brandmark {
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(1200px 300px at 0% 0%, #fff7ed 0, transparent 50%);
            border: 1px dashed rgba(249, 115, 22, .35);
            border-radius: 14px;
            padding: 18px;
            min-height: 140px;
        }

        .brandmark img {
            max-width: 280px;
            height: auto;
            display: block;
        }

        .legal {
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            margin-top: 10px;
            letter-spacing: .2px;
        }

        /* ===== Partners ===== */
        .partners {
            margin: 16px 26px 22px;
            border-top: 2px solid var(--brand);
            padding-top: 14px;
        }

        .partners h6 {
            margin: 0 0 8px 0;
            padding: 0;
            font-size: 13px;
            color: var(--ink);
        }

        .logos {
            display: flex;
            gap: 18px;
            align-items: center;
            flex-wrap: wrap;
        }

        .logos img {
            height: 60px;
            /* larger logos */
            object-fit: contain;
            filter: saturate(1.05);
            transition: transform .18s ease;
        }

        .logos img:hover {
            transform: translateY(-2px);
        }

        /* ===== Responsive polish ===== */
        @media (max-width:640px) {
            .right {
                border-left: none;
                padding-left: 0;
            }

            .brandmark img {
                max-width: 220px;
            }

            .logos img {
                height: 52px;
            }

            .contact div {
                padding: auto;
            }
        }
    </style>
</head>

<body>

    <!-- ===== Signature ===== -->
    <div class="sig">
        <div class="row">
            <!-- LEFT: Name + contact -->
            <div class="left">
                <div class="name">MARK <span class="accent">SMITHSON</span></div>
                <div class="role">GENERAL MANAGER &nbsp;•&nbsp; Elysium Electrical Ptv Ltd</div>

                <div class="chips">
                    <span class="chip">EC 16523</span>
                    <span class="chip">Commercial • Residential • Communications</span>
                </div>

                <div class="contact">
                    <div><i class="fas fa-phone"></i> <a href="tel:1234567890">1234567890</a></div>
                    <div><i class="fas fa-envelope"></i> <a href="mailto:info@youremail.com">info@youremail.com</a>
                    </div>
                    <div><i class="fas fa-globe"></i> <a href="https://www.yourwebsite.com">www.yourwebsite.com</a>
                    </div>
                </div>

                <div class="social">
                    <span>FOLLOW US:</span>
                    <a href="https://facebook.com" target="_blank" class="facebook"><i
                            class="fab fa-facebook-f"></i></a>
                    <a href="https://instagram.com" target="_blank" class="instagram"><i
                            class="fab fa-instagram"></i></a>
                    <a href="https://twitter.com" target="_blank" class="twitter"><i class="fab fa-twitter"></i></a>
                    <a href="https://linkedin.com" target="_blank" class="linkedin"><i
                            class="fab fa-linkedin-in"></i></a>
                </div>
            </div>

            <!-- RIGHT: big logo / crest -->
            <div class="right">
                <div class="brandmark">
                    <img src="Images/Elysium Electrical ab01-01.png" alt="Elysium Electrical logo">
                </div>
                <div class="legal">Contractors Pty Ltd · EC 16523</div>
            </div>
        </div>

        <!-- PARTNERS -->
        <div class="partners">
            <h4>Our Trusted Partners</h4>
            <div class="logos">
                <img src="Images/NECA+Member+logo_1.jpg" alt="NECA Member">
                <img src="Images/xero-logo_1.jpg" alt="Xero">
                <img src="Images/BUILDXACT-logo_1.jpg" alt="Buildxact">
                <img src="Images/HSEQ_hiRes_1.jpg" alt="HSEQ">
                <img src="Images/CM3+PREQUALIFIED_1.jpg" alt="CM3 Prequalified">
                <img src="Images/CES-logo_1.jpg" alt="CES">
            </div>
        </div>
    </div>
    <!-- ===== /Signature ===== -->

</body>

</html>
